name: CI/CD Pipeline - DevOps App

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE: vaishnavitikke/devops-app

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:

    # Checkout code
    - name: Checkout code
      uses: actions/checkout@v3

    # Setup Node (for basic test)
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    # Install dependencies
    - name: Install dependencies
      run: |
        cd app
        npm install

    # Basic test (you can improve later)
    - name: Run basic test
      run: |
        cd app
        node server.js &
        sleep 5
        curl -f http://localhost:3000 || exit 1

    # Docker login
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Build image
    - name: Build Docker image
      run: docker build -t $DOCKER_IMAGE:latest .

    # Push image
    - name: Push Docker image
      run: docker push $DOCKER_IMAGE:latest

    # Deploy to EC2
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull $DOCKER_IMAGE:latest
          docker stop devops-container || true
          docker rm devops-container || true
          docker run -d -p 3000:3000 --name devops-container $DOCKER_IMAGE:latest
