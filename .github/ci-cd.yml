name: CI-CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t devops-app .

      - name: Run Container Test
        run: docker run -d -p 3000:3000 devops-app

      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Push Image
        run: |
          docker tag devops-app ${{ secrets.DOCKER_USER }}/devops-app:latest
          docker push ${{ secrets.DOCKER_USER }}/devops-app:latest